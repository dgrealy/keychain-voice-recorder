; VoiceNote keychain firmware for the Seeed XIAO ESP32S3 Sense.
;
;   pio run -t upload        build (reads ../config.yaml) and flash over USB
;   pio device monitor       watch the serial log
;
; Uses the community pioarduino platform, which ships Arduino-ESP32 core 3.x
; (needed for the ESP_I2S PDM microphone driver).

[env:xiao_esp32s3_sense]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM
lib_deps = bblanchon/ArduinoJson@^7.2.0
extra_scripts = pre:scripts/gen_config.py
